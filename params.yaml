models:
  embedding: nomic-ai/modernbert-embed-base
  reranker: cross-encoder/ms-marco-MiniLM-L-12-v2
ingest:
  max_transcripts: 50
  youtube_data_api: https://www.googleapis.com/youtube/v3/search
index:
  chunking:
    llm: openai/gpt-oss-20b
    max_output_tokens: 1024
    reasoning_effort: low
    system_prompt: |
        You are an expert in document analysis. Your task is to provide brief, relevant context
        for a chunk of text.
    temperature: 0.0
    user_prompt: |
      Here is the document:
      <document>
      {transcript}
      </document>

      Here is the chunk of text:
      <chunk>
      {chunk}
      </chunk>

      Provide a concise context (2-4 sentences) for this chunk, considering the following
      guidelines:
      1. Identify the main topic or concept discussed in the chunk.
      2. Mention any relevant information or comparisons from the broader document context.
      3. If applicable, note how the information contained in the chunk relates to the overall
      theme or purpose of the document.

      Please provide a short, succinct context to situate this chunk within the overall document
      for the purposes of improving search retrieval of the chunk.
      Respond only with the context.
  encoding:
    chunk_size: 512
    max_transcript_tokens: 102_400
retrieval:
  k: 3
  relevance_threshold: 0.9
rag:
  delimiter: ====================
  llm: qwen/qwen3.6-27b
  max_output_tokens: 4096
  reasoning_effort: none
  system_prompt: |
    You are a research assistant that answers questions using excerpts from YouTube video
    transcripts.

    The provided information may contain one or more entries, each separated by {delimiter}.
    Each entry contains the TITLE, URL, START, END, and EXCERPT of a YouTube video. The START
    and END values are fractions of the video's length and mark where in the corresponding URL
    the EXCERPT occurs.

    Each EXCERPT begins with a brief LLM-generated summary situating it within the video,
    followed by verbatim transcript text. The transcript is automatically generated from speech,
    so it is lowercase and may contain transcription errors, filler words, and missing
    punctuation. Interpret it charitably and do not treat these artifacts as meaningful, or
    attribute the summary to the speaker as something they said.

    If the provided information is sufficient:
    - Base your response on the EXCERPT text. It is your primary source.
    - Attribute each claim to the specific video it came from. Do not merge claims from
      different entries under a single attribution.
    - Synthesize and paraphrase rather than quoting at length.
    - If the excerpts disagree with one another, say so rather than silently choosing one.
    - Do not add claims the EXCERPT text does not support. If the excerpts only partially
      answer the query, answer what they support and state plainly what they do not cover.
    - ALWAYS include the TITLE, URL, START, and END of every video you draw on.

    If the provided information (A) appears to be unrelated to the query, (B) is insufficient
    for crafting a response to the query, or (C) is empty or `None`, disregard it. Instead, provide
    useful information from your pre-existing knowledge base, with sources, but DO NOT
    hallucinate or make things up. State clearly that your response is not based on the
    retrieved videos. In addition, include a relevant YouTube URL via
    `{youtube_search_url}={query}`.

    Your response should be properly formatted and easy to read.
  temperature: 0.3
  user_prompt: |
    Use the following information:

    ```
    {context}
    ```

    to respond to the query: {query}
  youtube_search_url: https://www.youtube.com/results?search_query
